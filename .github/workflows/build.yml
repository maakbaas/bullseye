name: Build installer

# Builds the Windows installer on every push and keeps it as a downloadable artifact of the run
# (Actions tab > the run > Artifacts). Can also be started by hand (Run workflow).
on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes an unfinished build of it pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Carbon packages (dev dependencies, see scripts/vendor-carbon.mjs) report usage to IBM on
# install unless this is set.
env:
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Rust toolchain is already on the runner. This caches the compiled dependencies,
      # which is most of the build time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A tag `v1.2.3` is the version: written into the three files that hold one (the installer's
      # name and Windows' version come from tauri.conf.json, `bullseye version` from Cargo.toml),
      # for this build only. Nothing is committed; the files keep whatever they say.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$version\"/" src-tauri/tauri.conf.json
          sed -i "0,/\"version\": \".*\"/s//\"version\": \"$version\"/" package.json
          grep -m1 '^version' src-tauri/Cargo.toml
          grep '"version"' src-tauri/tauri.conf.json package.json

      # The code's formatting (src-tauri/rustfmt.toml), the quickest check first.
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      # The linter, tests included, with warnings as errors (`cargo clippy --all-targets` is kept clean).
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The unit tests, before spending time on the installer.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Same command as on a developer machine; produces the per-machine NSIS installer.
      - name: Build installer
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bullseye-installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # A tag such as `v0.1.0` also publishes the installer on the Releases page, which the README
  # points to. Nothing happens for an ordinary push.
  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bullseye-installer-${{ github.sha }}
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
