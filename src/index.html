<!doctype html>
<html lang="en" class="cds--g10">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bullseye</title>
    <!-- The Carbon design system, vendored (scripts/vendor-carbon.mjs): IBM Plex, the themes and
         tokens, and the cds-* web components. Nothing is loaded from the network. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <link rel="stylesheet" href="vendor/carbon.css" />
    <script>
      // Carbon's g10 theme, or g100 when Windows is set to dark; follows a change while open.
      (() => {
        const dark = matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          document.documentElement.classList.toggle("cds--g100", dark.matches);
          document.documentElement.classList.toggle("cds--g10", !dark.matches);
        };
        apply();
        dark.addEventListener("change", apply);
      })();
    </script>
    <script src="vendor/carbon.js"></script>
    <style>
      /* Layout only: colours, type and spacing all come from Carbon tokens and classes. */
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: var(--cds-background);
        color: var(--cds-text-primary);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      /* Until the components are defined, show nothing rather than unstyled markup. */
      body:not(.ready) { visibility: hidden; }
      /* Room for the header above. Every view fills the width up to Carbon's lg breakpoint (66rem)
         and is centred beyond it, so the margins grow evenly instead of jumping. */
      main { padding: calc(3rem + var(--cds-spacing-07)) 0 var(--cds-spacing-09); max-inline-size: 66rem; margin-inline: auto; }
      [hidden] { display: none !important; }

      /* A page: its header (title, description, main action), then its content. */
      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--cds-spacing-05);
        margin-bottom: var(--cds-spacing-07);
      }
      .page-header p { margin-top: var(--cds-spacing-03); color: var(--cds-text-secondary); max-width: 40rem; }
      .trail { display: block; margin-bottom: var(--cds-spacing-03); }
      .notices:empty { display: none; }
      .notices { margin-bottom: var(--cds-spacing-05); }
      .notices cds-inline-notification { max-width: none; }

      /* The blocks, as tiles in the Carbon grid. */
      /* The tiles are columns of the page's grid itself (this wrapper only keeps them together), so
         they line up with the header above them. */
      #tiles { display: contents; }
      /* One block per row, full width. On wider windows its actions move to the right of the row. */
      .block-tile.cds--css-grid-column { display: flex; flex-direction: column; gap: var(--cds-spacing-03); margin-bottom: var(--cds-spacing-05); }
      .block-tile .body { display: flex; flex-direction: column; gap: var(--cds-spacing-05); }
      .block-tile .info { display: flex; flex-direction: column; align-items: flex-start; gap: var(--cds-spacing-05); }
      .block-tile .top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--cds-spacing-03); }
      /* The size of the overflow menu's button it stands in for. */
      .block-tile .lock { display: flex; align-items: center; justify-content: center; flex: none; inline-size: var(--cds-spacing-08); block-size: var(--cds-spacing-08); fill: var(--cds-icon-secondary); }
      .block-tile h2 { overflow-wrap: anywhere; padding-top: var(--cds-spacing-02); }
      .block-tile .summary { display: flex; flex-direction: column; gap: var(--cds-spacing-02); color: var(--cds-text-secondary); }
      .block-tile .actions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--cds-spacing-04); }
      /* A block's lock, next to Start: the method, and a button to change its settings (in the modal). */
      .block-tile .lock-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--cds-spacing-04); }
      .block-tile .lock-method { inline-size: 9rem; }
      .modal-fields { display: flex; flex-direction: column; gap: var(--cds-spacing-06); }
      @media (min-width: 42rem) { /* Carbon's md breakpoint */
        .block-tile .body { flex-direction: row; align-items: flex-end; justify-content: space-between; }
        .block-tile .actions { flex: none; }
      }
      .empty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--cds-spacing-05); }

      /* The editor: sections stacked, lists side by side where there is room. */
      .form { display: flex; flex-direction: column; gap: var(--cds-spacing-07); }
      .form section { display: flex; flex-direction: column; gap: var(--cds-spacing-05); }
      .form section > p { color: var(--cds-text-secondary); margin-top: calc(-1 * var(--cds-spacing-03)); }
      .form section + section { padding-top: var(--cds-spacing-07); border-top: 1px solid var(--cds-border-subtle-01); }
      /* Top-aligned: a row stretched to the longer helper text would make one textarea taller. */
      .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); align-items: start; gap: var(--cds-spacing-05); }
      .lists:empty { display: none; }
      .inline-action { display: flex; flex-direction: column; align-items: flex-start; gap: var(--cds-spacing-04); }
      /* The weekly schedule: a column per day and a row per half hour, labelled every two hours.
         Carbon has no calendar grid, so this is layout in Carbon's tokens (see `weekEditor`). */
      /* As wide as the fields above it, whatever the window's width: the days share the room. */
      .week { display: grid; grid-template-columns: var(--cds-spacing-09) repeat(7, minmax(0, 1fr)); grid-auto-rows: var(--cds-spacing-03); inline-size: 100%; touch-action: none; user-select: none; }
      .week .day { align-self: center; text-align: center; color: var(--cds-text-secondary); }
      .week .hour { color: var(--cds-text-secondary); }
      .week .cell { background: var(--cds-layer-01); border-inline-start: 1px solid var(--cds-border-subtle-01); cursor: pointer; }
      .week .cell.hour-start { border-block-start: 1px solid var(--cds-border-subtle-01); }
      .week .cell.on { background: var(--cds-interactive); }
      .week.disabled .cell { cursor: default; }
      .week.disabled .cell.on { background: var(--cds-border-disabled); }
      .form-actions { display: flex; flex-wrap: wrap; gap: var(--cds-spacing-05); justify-content: space-between; }
      .form-actions .end { display: flex; flex-wrap: wrap; gap: var(--cds-spacing-05); margin-left: auto; }

      /* Settings. */
      .setting { display: flex; flex-direction: column; gap: var(--cds-spacing-05); }
      .setting p { color: var(--cds-text-secondary); }
      .setting .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--cds-spacing-05); }
      .setting .row cds-password-input { flex: 1 1 14rem; }
    </style>
  </head>
  <body>
    <!-- The pages are header actions on the right, as icons: blocks (home), block lists, schedules,
         settings. -->
    <cds-header aria-label="Bullseye">
      <cds-header-name href="#/" prefix="">Bullseye</cds-header-name>
      <div class="cds--header__global">
        <cds-header-global-action data-page="blocks" data-icon="home" aria-label="Blocks" tooltip-text="Blocks"></cds-header-global-action>
        <cds-header-global-action data-page="lists" data-icon="list-checked" aria-label="Block lists" tooltip-text="Block lists"></cds-header-global-action>
        <cds-header-global-action data-page="schedules" data-icon="calendar" aria-label="Schedules" tooltip-text="Schedules"></cds-header-global-action>
        <cds-header-global-action data-page="settings" data-icon="settings" aria-label="Settings" tooltip-text="Settings" tooltip-alignment="right"></cds-header-global-action>
      </div>
    </cds-header>

    <main>
      <!-- One page per kind (blocks, block lists, schedules): a tile each. Built from KINDS. -->
      <div id="view-list" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <div class="page-header">
            <div>
              <h1 class="cds--type-productive-heading-05" id="list-title"></h1>
              <p class="cds--type-body-01" id="list-description"></p>
            </div>
            <cds-button id="new-item" kind="primary" size="md"></cds-button>
          </div>
          <div class="notices" id="list-notices"></div>
        </div>
        <div id="tiles"></div>
        <cds-tile class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16 empty" id="empty" hidden>
          <h2 class="cds--type-productive-heading-03" id="empty-title"></h2>
          <p class="cds--type-body-01" id="empty-text"></p>
        </cds-tile>
      </div>

      <!-- Making or changing a block, a block list or a schedule: the kind's form goes in #form. -->
      <div id="view-editor" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <cds-breadcrumb class="trail" no-trailing-slash>
            <cds-breadcrumb-item><cds-breadcrumb-link id="editor-section"></cds-breadcrumb-link></cds-breadcrumb-item>
            <cds-breadcrumb-item><cds-breadcrumb-link is-currentpage id="editor-crumb"></cds-breadcrumb-link></cds-breadcrumb-item>
          </cds-breadcrumb>
          <div class="page-header">
            <div>
              <h1 class="cds--type-productive-heading-05" id="editor-title"></h1>
              <p class="cds--type-body-01" id="editor-description"></p>
            </div>
          </div>
          <div class="notices" id="editor-notices"></div>
          <div class="form">
            <div id="form" class="form"></div>
            <div class="form-actions">
              <cds-button id="delete" kind="danger--ghost" size="md" hidden>Delete</cds-button>
              <div class="end">
                <cds-button id="cancel" kind="secondary" size="md" href="#/">Cancel</cds-button>
                <cds-button id="save" kind="primary" size="md">Save</cds-button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings: the unlock password, kept apart from the blocks. -->
      <div id="view-settings" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <div class="page-header">
            <h1 class="cds--type-productive-heading-05">Settings</h1>
          </div>
          <div class="setting">
            <h2 class="cds--type-productive-heading-03">Unlock</h2>
            <p class="cds--type-body-01">Ends every running block, locked ones included, and quits Bullseye. The service stays installed and starts the app again at your next sign-in. This is the only way to end a locked block early.</p>
            <div class="notices" id="settings-notices"></div>
            <div class="row">
              <cds-password-input id="password" label="Unlock password" autocomplete="off"></cds-password-input>
              <cds-button id="unlock" kind="danger" size="md" disabled>Unlock</cds-button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Asks before anything that cannot be taken back (`ask` in the script). -->
    <cds-modal id="confirm" size="xs" prevent-close-on-click-outside>
      <cds-modal-header>
        <cds-modal-close-button></cds-modal-close-button>
        <cds-modal-heading id="confirm-heading"></cds-modal-heading>
      </cds-modal-header>
      <cds-modal-body>
        <cds-modal-body-content id="confirm-body"></cds-modal-body-content>
        <!-- A form's fields: a lock's settings, or the password that stops a block. -->
        <div id="confirm-fields" class="modal-fields" hidden></div>
      </cds-modal-body>
      <cds-modal-footer>
        <!-- Focus starts on Cancel, so a stray Enter or Space never confirms. -->
        <cds-modal-footer-button kind="secondary" data-modal-close data-modal-primary-focus>Cancel</cds-modal-footer-button>
        <cds-modal-footer-button id="confirm-action"></cds-modal-footer-button>
      </cds-modal-footer>
    </cds-modal>

    <script>
      const { invoke } = window.__TAURI__.core;
      const $ = (id) => document.getElementById(id);

      // ---- What things are made of. Three kinds, each a list of its own: block lists (what to
      // block), schedules (when) and blocks (one or more block lists, a schedule and a lock: what is
      // started). The editors, tiles and summaries are built from these tables, so a new kind of
      // list, enforcer or lock method is an entry here (plus its backend side, see CLAUDE.md).

      // The lists a block list can have (`definitions::BlockList`), by field name.
      const LISTS = {
        filters: {
          label: "Sites to block",
          placeholder: "youtube.com",
          helper: "One per line: a site and everything under it. * matches any part; a lone * blocks every site.",
          count: (n) => `${n} ${n === 1 ? "site" : "sites"} blocked`,
        },
        allowed: {
          label: "Always allowed",
          placeholder: "google.com",
          helper: "Exceptions to this list's sites. These always win.",
          count: (n) => `${n} always allowed`,
        },
        programs: {
          label: "Programs to close",
          placeholder: "steam.exe",
          helper: "One program per line, e.g. steam.exe; * matches any part. Windows' own programs cannot be listed.",
          count: (n) => `${n} ${n === 1 ? "program" : "programs"} closed`,
        },
      };

      // The enforcers (`state::Enforcers`), grouped into the block list editor's sections with the
      // lists they use.
      const SECTIONS = [
        {
          title: "Websites",
          description: "Closes pages on the list in Chrome, Edge and Brave.",
          lists: ["filters", "allowed"],
          enforcers: [
            { key: "chromium_tabs", label: "Close blocked tabs" },
            { key: "chromium_split_view", label: "Close blocked pages in split view" },
          ],
        },
        {
          title: "Programs",
          description: "Asks the programs on the list to close, and ends them after 3 seconds.",
          lists: ["programs"],
          enforcers: [{ key: "exe_names", label: "Close these programs" }],
        },
        {
          title: "Apps",
          description: "Need no list.",
          lists: [],
          enforcers: [{ key: "obsidian_web_viewer", label: "Close Obsidian when it shows web pages", short: "Closes Obsidian's web viewer" }],
        },
      ];

      // How a started block is kept from being stopped (`lock::Lock`), by `method`. Set on the
      // block's tile, next to Start. `confirm` says what starting it asks first (null: nothing).
      const LOCKS = {
        none: {
          label: "No lock",
          describe: () => "Not locked: can be stopped at any time",
          confirm: async () => null,
        },
        timer: {
          label: "Timer",
          form: (block) => {
            const input = el("cds-text-input", { label: "Locked for", placeholder: "e.g. 2h 30m", "helper-text": "Combine as you like: 30m, 2h 30m, 1d" });
            input.value = (block.lock.method === "timer" && block.lock.duration) || "";
            return {
              fields: [input],
              read: async () => {
                const duration = input.value.trim();
                const fault = await invoke("describe_duration", { text: duration }).then(() => null, (e) => String(e));
                return invalid(input, fault) ? null : { method: "timer", duration };
              },
            };
          },
          describe: (lock) => `Locked for ${durationText(lock.duration)} once started`,
          confirm: async (block) => {
            const words = await invoke("describe_duration", { text: block.lock.duration || "" }).catch(() => block.lock.duration);
            return {
              heading: `Start “${block.name}” for ${words}?`,
              body: `It cannot be stopped, changed or deleted for ${words}. Only the unlock password in Settings ends it early.`,
              action: `Start for ${words}`,
            };
          },
        },
        scheduled: {
          label: "Schedule",
          // A schedule of its own: with the block's own schedule, it is locked exactly while active.
          // Only with a schedule to choose (`renderBlockControls` disables it otherwise).
          form: (block) => {
            const select = el("cds-select", { "label-text": "Locked during", "helper-text": "It cannot be stopped while this schedule is active" });
            select.append(...overview.schedules.map((s) => el("cds-select-item", { value: s.id, label: s.name }, s.name)));
            // The block's own schedule first: then it is locked exactly while it is active.
            const chosen = block.lock.method === "scheduled" ? block.lock.schedule : block.schedule;
            select.value = overview.schedules.some((s) => s.id === chosen) ? chosen : (overview.schedules[0] || {}).id || "";
            return { fields: [select], read: async () => (invalid(select, select.value ? null : "Choose a schedule") ? null : { method: "scheduled", schedule: select.value }) };
          },
          describe: (lock) => {
            const schedule = overview.schedules.find((s) => s.id === lock.schedule);
            return schedule ? `Locked while “${schedule.name}” is active (${weekText(schedule.days)})` : "Locked by a schedule that is gone";
          },
          confirm: async (block) => {
            const schedule = overview.schedules.find((s) => s.id === block.lock.schedule);
            const name = schedule ? schedule.name : "its lock schedule";
            const when = schedule ? await invoke("describe_schedule", { week: { days: schedule.days } }).catch(() => "") : "";
            return {
              heading: `Start “${block.name}” locked during “${name}”?`,
              body: `It cannot be stopped while “${name}” is active${when ? ` (${when})` : ""}. Outside those times you can stop it. Only the unlock password in Settings ends it early.`,
              action: "Start locked",
            };
          },
        },
        password: {
          label: "Password",
          // Typed on the tile and sent once; the service keeps only a salted hash and never sends
          // either back, so a block that has one just says so.
          // Typed twice, as nothing ever shows it again: a typo would leave a lock only the unlock
          // password opens.
          form: () => {
            const password = el("cds-password-input", { label: "Password", autocomplete: "new-password", "helper-text": "Best chosen by someone else. Only a hash of it is kept." });
            const repeat = el("cds-password-input", { label: "Repeat password", autocomplete: "new-password" });
            return {
              fields: [password, repeat],
              read: async () => {
                if (invalid(password, password.value ? null : "Type a password")) return null;
                if (invalid(repeat, repeat.value === password.value ? null : "The passwords differ")) return null;
                return { method: "password", password: password.value };
              },
            };
          },
          describe: () => "Locked with a password once started",
          confirm: async (block) => ({
            heading: `Start “${block.name}” locked with a password?`,
            body: "It can only be stopped with its password, or with the unlock password in Settings.",
            action: "Start locked",
          }),
        },
      };

      const ENFORCERS = SECTIONS.flatMap((section) => section.enforcers);

      // ---- Small helpers.

      function el(tag, attributes = {}, ...children) {
        const node = document.createElement(tag);
        for (const [name, value] of Object.entries(attributes)) {
          if (value === false || value == null) continue;
          node.setAttribute(name, value === true ? "" : value);
        }
        node.append(...children.filter((c) => c != null));
        return node;
      }

      // Text that only the backend writes, so the window says exactly what the CLI says: a weekly
      // schedule (`Mon-Fri 08:00-17:00`) and a lock's length (`2 hours 30 minutes 0 seconds`). Asked
      // once per value; until the answer is in, a stand-in, and the page is drawn again when it comes.
      const texts = new Map();
      function described(command, args, standIn) {
        const key = command + JSON.stringify(args);
        if (!texts.has(key)) {
          texts.set(key, standIn);
          invoke(command, args)
            .then((text) => texts.set(key, text))
            .catch(() => texts.set(key, standIn))
            .finally(render);
        }
        return texts.get(key);
      }
      const weekText = (days) => described("describe_schedule", { week: { days } }, "a weekly schedule");
      const durationText = (text) => described("describe_duration", { text: text || "" }, text || "");

      function lines(text) {
        return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      }

      const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `i${Date.now()}${Math.random().toString(36).slice(2)}`);

      // One message per place; a new one replaces the old.
      function notify(slot, kind, title, subtitle = "", { closable = true } = {}) {
        const box = $(slot);
        box.replaceChildren();
        if (!title) return;
        box.append(el("cds-inline-notification", { kind, title, subtitle, "low-contrast": true, "hide-close-button": !closable }));
      }

      // ---- The service's view of things, asked every second while the window is shown.

      let overview = { lists: [], schedules: [], blocks: [], running: [], clock_synced: true };
      let reachable = true;

      async function refresh() {
        try {
          overview = await invoke("block_status");
          if (!reachable) notify("list-notices");
          reachable = true;
        } catch (e) {
          // The service did not answer: say so, and leave the rest as it was.
          reachable = false;
          notify("list-notices", "error", "The Bullseye service does not answer", String(e));
        }
        render();
      }

      const runningOf = (id) => overview.running.find((r) => r.id === id);
      const scheduleOf = (block) => overview.schedules.find((s) => s.id === block.schedule);
      const listName = (id) => (overview.lists.find((l) => l.id === id) || { name: "(gone)" }).name;
      // The blocks that use a block list or schedule, and those of them that run (which hold it).
      const usersOf = (id) => overview.blocks.filter((b) => b.lists.includes(id) || b.schedule === id || (b.lock && b.lock.schedule === id));
      const holdersOf = (id) => usersOf(id).filter((b) => runningOf(b.id));
      const names = (blocks) => blocks.map((b) => `“${b.name}”`).join(", ");

      // ---- The three kinds. Each has a page of tiles and an editor.

      const KINDS = {
        blocks: {
          path: "#/",
          editPath: "#/edit/",
          newPath: "#/new",
          title: "Blocks",
          noun: "block",
          description: "A block is what you start: one or more block lists, a schedule and a lock. Start any of them; they run independently.",
          newLabel: "New block",
          empty: ["No blocks yet", "A block combines block lists (what to block) with a schedule (when). Make block lists first, then use New block."],
          items: () => overview.blocks,
          create: () => ({ id: newId(), name: "", lists: [], schedule: null, lock: { method: "none" } }),
          save: (block) => invoke("save_block", { block }),
          remove: (id) => invoke("delete_block", { id }),
          // Why it cannot be changed now, or null.
          held: (block) => (runningOf(block.id) ? "This block is running. Its settings can be changed once it ends." : null),
          editorDescription: "A block enforces its block lists, when its schedule has it active. Its lock is set on its tile, next to Start.",
          form: () => blockForm(),
        },
        lists: {
          path: "#/lists",
          editPath: "#/lists/edit/",
          newPath: "#/lists/new",
          title: "Block lists",
          noun: "block list",
          description: "What to block: sites, programs and apps, and how to close them. Blocks use them; one list can be in several blocks.",
          newLabel: "New block list",
          empty: ["No block lists yet", "A block list holds sites and programs to close, and the ways to close them. Use New block list to make one."],
          items: () => overview.lists,
          create: () => ({
            id: newId(),
            name: "",
            ...Object.fromEntries(Object.keys(LISTS).map((key) => [key, []])),
            enforcers: Object.fromEntries(ENFORCERS.map((e) => [e.key, true])),
          }),
          save: (list) => invoke("save_list", { list }),
          remove: (id) => invoke("delete_list", { id }),
          held: (list) => {
            const holders = holdersOf(list.id);
            return holders.length ? `${names(holders)} uses it and is running. It can be changed once that has ended.` : null;
          },
          editorDescription: "Kept by the Bullseye service. A running block keeps the lists it was started with.",
          form: () => listForm(),
        },
        schedules: {
          path: "#/schedules",
          editPath: "#/schedules/edit/",
          newPath: "#/schedules/new",
          title: "Schedules",
          noun: "schedule",
          description: "When a block is active, as a weekly schedule. A block without one is always active. Outside its schedule a running block blocks nothing.",
          newLabel: "New schedule",
          empty: ["No schedules yet", "Blocks without a schedule are always active. Use New schedule to make one, e.g. work hours."],
          items: () => overview.schedules,
          create: () => ({ id: newId(), name: "", days: [0, 1, 2, 3, 4, 5, 6].map((day) => (day < 5 ? [[480, 1020]] : [])) }),
          save: (schedule) => invoke("save_schedule", { schedule }),
          remove: (id) => invoke("delete_schedule", { id }),
          held: (schedule) => {
            const holders = holdersOf(schedule.id);
            return holders.length ? `${names(holders)} uses it and is running. It can be changed once that has ended.` : null;
          },
          editorDescription: "Kept by the Bullseye service. A running block keeps the schedule it was started with.",
          form: () => scheduleForm(),
        },
      };

      // What a tile says, per kind: lines of text.
      function summaryOf(kind, item) {
        if (kind === "lists") {
          const parts = [];
          for (const [key, list] of Object.entries(LISTS)) if (item[key] && item[key].length) parts.push(list.count(item[key].length));
          const on = ENFORCERS.filter((e) => item.enforcers && item.enforcers[e.key]);
          for (const e of on.filter((e) => !SECTIONS.find((s) => s.enforcers.includes(e)).lists.length)) parts.push(e.short || e.label);
          if (!parts.length) parts.push("Nothing to block yet");
          const users = usersOf(item.id);
          parts.push(users.length ? `Used by ${names(users)}` : "Not in a block yet");
          return parts;
        }
        if (kind === "schedules") {
          const users = usersOf(item.id);
          return [`Active ${weekText(item.days)}`, users.length ? `Used by ${names(users)}` : "Not used by a block yet"];
        }
        // A block: what it runs with while it runs, else what it is defined as.
        const running = runningOf(item.id);
        const parts = [];
        const lists = running ? running.lists.map((l) => l.name) : item.lists.map(listName);
        parts.push(lists.length ? lists.join(", ") : "No block lists yet");
        const schedule = scheduleOf(item);
        const days = running ? running.schedule && running.schedule.days : schedule && schedule.days;
        parts.push(days ? `Active ${weekText(days)}${schedule ? ` (${schedule.name})` : ""}` : "Always active");
        if (!running) {
          const lock = LOCKS[item.lock && item.lock.method];
          parts.push(lock ? lock.describe(item.lock) : "Unknown lock");
          return parts;
        }
        if (running.password) parts.push("Locked with a password: stop it with its password");
        else if (running.remaining_words) parts.push(`Locked: ${running.remaining_words} left`);
        else if (running.lock_schedule) {
          const change = running.lock_change_words;
          if (running.locked) parts.push(change ? `Locked by its lock schedule, for another ${change}` : "Locked by its lock schedule");
          else parts.push(change ? `Not locked now: can be stopped; locked again in ${change}` : "Not locked now: can be stopped");
        }
        else parts.push("Not locked: can be stopped at any time");
        if (running.enforcing && running.schedule_change_words) parts.push(`Active now; inactive in ${running.schedule_change_words}`);
        if (!running.enforcing) parts.push(running.schedule_change_words ? `Inactive by its schedule; active again in ${running.schedule_change_words}` : "Inactive by its schedule");
        return parts;
      }

      // ---- A page of tiles. Tiles are kept and updated in place, so an open menu or a lock being
      // typed survives a refresh.

      let page = "blocks"; // the kind whose page or editor is shown
      const tiles = new Map(); // `${kind}:${id}` -> its parts

      function makeTile(kind, id) {
        // The class is how Carbon colours an overflow menu's icon (without it: white on a white tile).
        const menuIcon = carbonIcon("overflow-menu-vertical", "icon");
        menuIcon.classList.add("cds--overflow-menu__icon");
        const menu = el(
          "cds-overflow-menu",
          { "aria-label": "Options", "menu-alignment": "bottom-end" },
          menuIcon,
          el("span", { slot: "tooltip-content" }, "Options"),
          el(
            "cds-overflow-menu-body",
            { flipped: true },
            el("cds-overflow-menu-item", { "data-action": "edit" }, "Edit"),
            el("cds-overflow-menu-item", { "data-action": "delete", danger: true }, "Delete"),
          ),
        );
        // In the menu's place while it cannot be changed: a running block, or a list or schedule one uses.
        const lock = el("span", { class: "lock", role: "img", "aria-label": "Locked", title: "Locked" }, carbonIcon("locked"));
        const name = el("h2", { class: "cds--type-productive-heading-03" });
        const tag = el("cds-tag", { size: "md" });
        const summary = el("div", { class: "summary cds--type-body-compact-01" });
        const actions = el("div", { class: "actions" });
        const tile = el(
          "cds-tile",
          { class: "block-tile cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16" },
          el("div", { class: "top" }, el("div", {}, name), menu, lock),
          el("div", { class: "body" }, el("div", { class: "info" }, tag, summary), actions),
        );
        // On the items themselves: Carbon moves the open menu out of the tile.
        for (const item of menu.querySelectorAll("[data-action]")) {
          item.addEventListener("click", () => {
            if (item.dataset.action === "edit") location.hash = KINDS[kind].editPath + encodeURIComponent(id);
            if (item.dataset.action === "delete") confirmDelete(kind, id);
          });
        }
        const parts = { tile, name, tag, summary, actions, menu, lock };
        if (kind === "blocks") addBlockControls(parts, id);
        tiles.set(`${kind}:${id}`, parts);
        return parts;
      }

      function render() {
        if (!$("view-list").hidden) renderTiles(page);
        renderEditorLock();
      }

      function renderTiles(kind) {
        const container = $("tiles");
        const kindOf = KINDS[kind];
        const shown = kindOf.items();
        const wanted = new Set(shown.map((item) => `${kind}:${item.id}`));
        for (const [key, parts] of tiles) {
          if (!wanted.has(key)) {
            parts.tile.remove();
            tiles.delete(key);
          }
        }
        shown.forEach((item, index) => {
          const parts = tiles.get(`${kind}:${item.id}`) || makeTile(kind, item.id);
          if (container.children[index] !== parts.tile) container.insertBefore(parts.tile, container.children[index] || null);
          parts.name.textContent = item.name;
          const summary = summaryOf(kind, item);
          if (parts.summary.dataset.text !== summary.join("\n")) {
            parts.summary.dataset.text = summary.join("\n");
            parts.summary.replaceChildren(...summary.map((line) => el("span", {}, line)));
          }
          const held = kindOf.held(item);
          parts.menu.hidden = !!held;
          parts.lock.hidden = !parts.menu.hidden;
          if (kind === "blocks") renderBlockControls(parts, item);
          else {
            parts.tag.hidden = !held;
            parts.tag.setAttribute("type", "blue");
            parts.tag.textContent = "In use by a running block";
          }
        });
        $("empty").hidden = shown.length > 0;
      }

      // ---- A block's tile: its state, its lock (set here, next to Start) and Start / Stop.

      function addBlockControls(parts, id) {
        const method = el("cds-select", { "label-text": "Lock", size: "sm", class: "lock-method" });
        for (const [key, lock] of Object.entries(LOCKS)) method.append(el("cds-select-item", { value: key, label: lock.label }, lock.label));
        const change = el("cds-button", { kind: "ghost", size: "sm", "tooltip-text": "Change the lock", "tooltip-position": "top" }, carbonIcon("edit", "icon"));
        const toggle = el("cds-button", { kind: "primary", size: "sm" });
        const controls = el("div", { class: "lock-controls" }, method, change);
        parts.actions.append(controls, toggle);
        Object.assign(parts, { method, change, toggle, controls });
        method.addEventListener("cds-select-selected", () => setLock(id, method.value));
        change.addEventListener("click", () => setLock(id, method.value));
        toggle.addEventListener("click", () => startOrStop(id));
      }

      // Sets a block's lock to `method`: what the method needs is asked for in the modal, and the
      // lock is saved with the block once it is given. Cancel leaves the lock as it was.
      async function setLock(id, method) {
        const parts = tiles.get(`blocks:${id}`);
        const block = overview.blocks.find((b) => b.id === id);
        if (!block) return;
        const form = LOCKS[method].form && LOCKS[method].form(block);
        let lock = { method };
        if (form) {
          // Kept on the tile while the dialog is open, though the block has the old lock still.
          parts.choosing = true;
          lock = await ask({ heading: `${LOCKS[method].label} lock for “${block.name}”`, action: "Save", kind: "primary", fields: form.fields, read: form.read });
        }
        if (lock) {
          try {
            await invoke("save_block", { block: { ...block, lock } });
            notify("list-notices");
          } catch (e) {
            notify("list-notices", "error", `Could not set the lock of “${block.name}”`, String(e));
          }
        }
        // Cancelled or refused: the tile shows the lock the block has.
        parts.choosing = false;
        parts.method.value = block.lock.method;
        await refresh();
      }

      // Marks a field as wrong (with why) or right again; true when wrong.
      function invalid(field, why) {
        field.toggleAttribute("invalid", !!why);
        if (why) field.setAttribute("invalid-text", why);
        return !!why;
      }

      function renderBlockControls(parts, block) {
        const running = runningOf(block.id);
        const quiet = running && running.enforcing === false;
        parts.tag.hidden = false;
        parts.tag.setAttribute("type", running ? (quiet ? "cool-gray" : running.locked ? "green" : "blue") : "gray");
        parts.tag.textContent = running ? (quiet ? "Inactive by schedule" : running.locked ? "Running · locked" : "Running") : "Not running";
        // The lock is set while the block is stopped; a running block's is in its summary.
        parts.controls.hidden = !!running;
        if (block.lock && !parts.choosing && parts.method.value !== block.lock.method) parts.method.value = block.lock.method;
        // Settings to change: all but No lock.
        parts.change.hidden = !LOCKS[parts.method.value] || !LOCKS[parts.method.value].form;
        // A lock schedule needs a schedule to choose.
        const scheduled = parts.method.querySelector('[value="scheduled"]');
        if (scheduled) scheduled.disabled = overview.schedules.length === 0 && parts.method.value !== "scheduled";
        const busy = parts.toggle.dataset.busy === "1";
        const action = running ? "stop" : "start";
        if (parts.toggle.dataset.action !== action) {
          parts.toggle.dataset.action = action;
          parts.toggle.setAttribute("kind", running ? "secondary" : "primary");
          parts.toggle.replaceChildren(running ? "Stop" : "Start", carbonIcon(running ? "stop" : "play", "icon"));
        }
        // A block locked with a password stops with it (asked for on Stop).
        parts.toggle.disabled = busy || (running && running.locked && !running.password) || !reachable;
      }

      async function startOrStop(id) {
        const parts = tiles.get(`blocks:${id}`);
        const running = runningOf(id);
        const block = overview.blocks.find((b) => b.id === id);
        // A block that cannot be stopped is only started after a second, deliberate click.
        const lock = !running && LOCKS[block.lock.method];
        const question = lock && (await lock.confirm(block));
        if (question && !(await ask({ ...question, kind: "primary" }))) return;
        // A block locked with a password stops with it.
        let password = null;
        if (running && running.password) {
          const field = el("cds-password-input", { label: "Password", autocomplete: "off" });
          const given = await ask({
            heading: `Stop “${block.name}”?`,
            body: "It is locked with a password. Enter it to stop the block.",
            action: "Stop",
            kind: "danger",
            fields: [field],
            read: async () => (invalid(field, field.value ? null : "Type its password") ? null : field.value),
          });
          if (!given) return;
          password = given;
        }
        parts.toggle.dataset.busy = "1";
        parts.toggle.disabled = true;
        try {
          if (running) await invoke("stop_block", { id, password });
          else await invoke("start_block", { id });
          notify("list-notices");
        } catch (e) {
          notify("list-notices", "error", `Could not ${running ? "stop" : "start"} “${block ? block.name : "the block"}”`, String(e));
        }
        parts.toggle.dataset.busy = "";
        await refresh();
      }

      // The one dialog: a question before anything that cannot be taken back, or a short form (a
      // lock's settings, a password). Resolves false for Cancel, the X or Escape; otherwise true,
      // or with `fields`, what `read` makes of them: the dialog stays open while that is null (the
      // fields then say what is wrong).
      let answer = null;
      let reader = null;
      function ask({ heading, body = "", action, kind, fields = [], read = null }) {
        if (answer) answer(false);
        $("confirm-heading").textContent = heading;
        $("confirm-body").textContent = body;
        $("confirm-body").hidden = !body;
        $("confirm-action").textContent = action;
        $("confirm-action").setAttribute("kind", kind);
        $("confirm-fields").replaceChildren(...fields);
        $("confirm-fields").hidden = fields.length === 0;
        $("confirm").setAttribute("size", fields.length ? "sm" : "xs");
        reader = read;
        $("confirm").open = true;
        // A form starts in its first field; a question on Cancel.
        if (fields.length) setTimeout(() => fields[0].focus(), 100);
        return new Promise((resolve) => (answer = resolve));
      }
      $("confirm-fields").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("confirm-action").click();
      });
      function answered(value) {
        const resolve = answer;
        answer = null;
        if (resolve) resolve(value);
      }
      $("confirm-action").addEventListener("click", async () => {
        const value = reader ? await reader() : true;
        if (value === null || value === undefined) return;
        $("confirm").open = false;
        answered(value);
      });
      $("confirm").addEventListener("cds-modal-closed", () => answered(false));

      async function confirmDelete(kind, id) {
        const kindOf = KINDS[kind];
        const item = kindOf.items().find((i) => i.id === id);
        if (!item) return;
        const sure = await ask({
          heading: `Delete “${item.name}”?`,
          body: `The ${kindOf.noun} is removed. This cannot be undone.`,
          action: "Delete",
          kind: "danger",
        });
        if (!sure) return;
        const inEditor = !$("view-editor").hidden;
        try {
          await kindOf.remove(id);
          notify("list-notices");
          if (inEditor) location.hash = kindOf.path;
        } catch (e) {
          notify(inEditor ? "editor-notices" : "list-notices", "error", `Could not delete the ${kindOf.noun}`, String(e));
        }
        await refresh();
      }

      // ---- The editors. Each kind's form is built once and reused; every form has `nodes`,
      // `fill(item)`, `read(item)` (the item with the form's values), `disable(off)`, `settle()`
      // (finish what is being typed) and `error()` (what is wrong, or null).

      function nameField(placeholder) {
        const input = el("cds-text-input", { label: "Name", placeholder, "max-count": "60" });
        input.addEventListener("input", () => (input.invalid = false));
        return input;
      }

      // The schedule select's choice for no schedule (an empty value reads as nothing chosen).
      const ALWAYS = "always";

      function blockForm() {
        const name = nameField("e.g. Work hours");
        const lists = el("cds-checkbox-group", { "legend-text": "Block lists" });
        const noLists = el(
          "div",
          { class: "inline-action" },
          el("p", { class: "cds--type-body-01" }, "No block lists yet: a block needs at least one."),
          el("cds-button", { kind: "tertiary", size: "md", href: "#/lists/new" }, "New block list"),
        );
        const schedule = el("cds-select", { "label-text": "Schedule", "helper-text": "When it is active once started. Schedules are made on the Schedules page." });
        let boxes = {};
        const section = (title, text, ...content) =>
          el("section", {}, el("h2", { class: "cds--type-productive-heading-03" }, title), el("p", { class: "cds--type-body-01" }, text), ...content);
        return {
          nodes: [
            el("section", {}, name),
            section("What", "The block lists it enforces, each by its own enforcers and allowed sites.", lists, noLists),
            section("When", "Outside its schedule a running block blocks nothing, but keeps running.", schedule),
          ],
          fill(block) {
            name.value = block.name;
            boxes = {};
            lists.replaceChildren(
              ...overview.lists.map((list) => {
                const box = el("cds-checkbox", { "label-text": list.name });
                box.checked = block.lists.includes(list.id);
                boxes[list.id] = box;
                return box;
              }),
            );
            lists.hidden = !overview.lists.length;
            noLists.hidden = !!overview.lists.length;
            schedule.replaceChildren(
              el("cds-select-item", { value: ALWAYS, label: "Always" }, "Always"),
              ...overview.schedules.map((s) => el("cds-select-item", { value: s.id, label: s.name }, s.name)),
            );
            schedule.value = block.schedule || ALWAYS;
          },
          read: (block) => ({
            ...block,
            name: name.value.trim(),
            lists: overview.lists.filter((l) => boxes[l.id] && boxes[l.id].checked).map((l) => l.id),
            schedule: schedule.value && schedule.value !== ALWAYS ? schedule.value : null,
          }),
          disable(off) {
            for (const control of [name, schedule, ...Object.values(boxes)]) control.disabled = off;
          },
          settle: async () => {},
          error: () => (name.value.trim() ? null : "Give the block a name"),
          name,
        };
      }

      // Text areas side by side (the sites to block and the allowed ones) keep one height: dragging
      // one's resize handle sizes the others in its row too. Carbon's textarea has no attribute or
      // part for its height, so this sets the same inline height on the others' own <textarea> that
      // the browser's resize handle set on the dragged one; nothing else of the component is touched.
      // Stacked (a narrow window), each keeps its own height.
      function sameHeight(areas) {
        if (areas.length < 2) return;
        Promise.all(areas.map((area) => customElements.whenDefined("cds-textarea").then(() => area.updateComplete))).then(() => {
          const inner = areas.map((area) => area.shadowRoot && area.shadowRoot.querySelector("textarea")).filter(Boolean);
          let syncing = false;
          const observer = new ResizeObserver((entries) => {
            if (syncing) return;
            const moved = entries.find((entry) => entry.target.style.height);
            if (!moved) return;
            const row = moved.target.getBoundingClientRect().top;
            syncing = true;
            for (const other of inner) {
              if (other !== moved.target && Math.abs(other.getBoundingClientRect().top - row) < 1 && other.style.height !== moved.target.style.height) {
                other.style.height = moved.target.style.height;
              }
            }
            // The others' resize comes back as an entry of its own: let it pass before listening again.
            requestAnimationFrame(() => (syncing = false));
          });
          for (const textarea of inner) observer.observe(textarea);
        });
      }

      function listForm() {
        const name = nameField("e.g. Social media");
        const areas = {};
        const checks = {};
        const nodes = [el("section", {}, name)];
        for (const section of SECTIONS) {
          const lists = el("div", { class: "lists" });
          for (const key of section.lists) {
            const list = LISTS[key];
            areas[key] = el("cds-textarea", { label: list.label, placeholder: list.placeholder, "helper-text": list.helper, rows: 5 });
            lists.append(areas[key]);
          }
          sameHeight(section.lists.map((key) => areas[key]));
          const group = el("cds-checkbox-group", { "legend-text": section.lists.length ? "How" : "Enforcers" });
          for (const enforcer of section.enforcers) {
            checks[enforcer.key] = el("cds-checkbox", { "label-text": enforcer.label });
            group.append(checks[enforcer.key]);
          }
          nodes.push(
            el(
              "section",
              {},
              el("h2", { class: "cds--type-productive-heading-03" }, section.title),
              el("p", { class: "cds--type-body-01" }, section.description),
              lists,
              group,
            ),
          );
        }
        return {
          nodes,
          fill(list) {
            name.value = list.name;
            for (const [key, area] of Object.entries(areas)) area.value = (list[key] || []).join("\n");
            for (const [key, box] of Object.entries(checks)) box.checked = !!(list.enforcers && list.enforcers[key]);
          },
          read(list) {
            const out = { ...list, name: name.value.trim(), enforcers: { ...list.enforcers } };
            for (const [key, area] of Object.entries(areas)) out[key] = lines(area.value);
            for (const [key, box] of Object.entries(checks)) out.enforcers[key] = box.checked;
            return out;
          },
          disable(off) {
            for (const control of [name, ...Object.values(areas), ...Object.values(checks)]) control.disabled = off;
          },
          settle: async () => {},
          error: () => (name.value.trim() ? null : "Give the block list a name"),
          name,
        };
      }

      function scheduleForm() {
        const name = nameField("e.g. Work hours");
        const week = weekEditor();
        return {
          nodes: [el("section", {}, name), el("section", {}, ...week.nodes)],
          fill(schedule) {
            name.value = schedule.name;
            week.fill(schedule);
          },
          read: (schedule) => ({ ...schedule, name: name.value.trim(), days: week.read().days }),
          disable(off) {
            name.disabled = off;
            week.disable(off);
          },
          settle: () => week.settle(),
          error: () => (name.value.trim() ? week.error() : "Give the schedule a name"),
          name,
        };
      }

      // The weekly schedule: as text (what the CLI takes too) and as the week, a column per day and a
      // cell per half hour, that can be dragged over. Carbon has no calendar or time-grid component, so
      // the week is plain layout in Carbon's tokens; the text field is the accessible way to set it,
      // and the week mirrors it.
      const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const SLOT = 30; // minutes per cell

      function weekEditor() {
        const text = el("cds-text-input", {
          label: "Times",
          placeholder: "e.g. Mon-Fri 08:00-17:00",
          "helper-text": "Days and times, e.g. Mon-Fri 08:00-17:00; Sat 10:00-12:00. Or drag over the week below to mark times, or to clear them by starting on a marked one.",
        });
        const grid = el("div", { class: "week", "aria-hidden": "true" });
        const cells = DAY_NAMES.map(() => []);
        let days = DAY_NAMES.map(() => []);
        let disabled = false;
        let problem = null;
        let typing = 0;

        const place = (node, column, row, rows) => {
          node.style.gridColumn = String(column);
          node.style.gridRow = `${row} / span ${rows}`;
          grid.append(node);
        };
        DAY_NAMES.forEach((name, day) => place(el("div", { class: "day cds--type-label-01" }, name), day + 2, 1, 3));
        for (let slot = 0; slot < (24 * 60) / SLOT; slot++) {
          if (slot % 4 === 0) place(el("div", { class: "hour cds--type-label-01" }, `${String(slot / 2).padStart(2, "0")}:00`), 1, slot + 4, 4);
          DAY_NAMES.forEach((_, day) => {
            const cell = el("div", { class: slot % 2 === 0 ? "cell hour-start" : "cell", "data-day": day, "data-slot": slot });
            cells[day].push(cell);
            place(cell, day + 2, slot + 4, 1);
          });
        }

        // A cell is marked when any of its half hour is in the schedule (a typed one can be finer).
        function draw() {
          cells.forEach((column, day) =>
            column.forEach((cell, slot) => {
              const [start, end] = [slot * SLOT, slot * SLOT + SLOT];
              cell.classList.toggle("on", days[day].some(([from, to]) => from < end && to > start));
            }),
          );
          grid.classList.toggle("disabled", disabled);
        }

        function wrong(why) {
          problem = why;
          text.invalid = !!why;
          if (why) text.setAttribute("invalid-text", why);
        }

        // The week as text, from the backend, so it reads exactly as the CLI writes it.
        async function describe() {
          try {
            text.value = await invoke("describe_schedule", { week: { days } });
            wrong(null);
          } catch (e) {
            wrong(String(e));
          }
        }

        async function parseText() {
          typing = 0;
          try {
            const parsed = await invoke("parse_schedule", { text: text.value });
            if (!parsed) return wrong("Type the days and times; a block that is always active needs no schedule");
            days = parsed.days;
            wrong(null);
            draw();
          } catch (e) {
            wrong(String(e));
          }
        }
        text.addEventListener("input", () => {
          clearTimeout(typing);
          typing = setTimeout(parseText, 400);
        });

        // Dragging from one cell to another marks the rectangle between them (those days, those
        // times), or clears it when the drag starts on a marked cell. Only the days it covers are
        // rewritten, so a typed schedule keeps its exact minutes on the others.
        let painting = null;
        const cellAt = (event) => {
          const node = document.elementFromPoint(event.clientX, event.clientY);
          return node && node.classList.contains("cell") && grid.contains(node) ? node : null;
        };
        const position = (cell) => ({ day: Number(cell.dataset.day), slot: Number(cell.dataset.slot) });
        function paint(to) {
          const from = painting.from;
          const [firstDay, lastDay] = [Math.min(from.day, to.day), Math.max(from.day, to.day)];
          const [firstSlot, lastSlot] = [Math.min(from.slot, to.slot), Math.max(from.slot, to.slot)];
          cells.forEach((column, day) =>
            column.forEach((cell, slot) => {
              const inside = day >= firstDay && day <= lastDay && slot >= firstSlot && slot <= lastSlot;
              cell.classList.toggle("on", inside ? painting.on : painting.before[day][slot]);
            }),
          );
          for (let day = firstDay; day <= lastDay; day++) painting.days.add(day);
        }
        function spansOf(day) {
          const spans = [];
          cells[day].forEach((cell, slot) => {
            if (!cell.classList.contains("on")) return;
            const last = spans[spans.length - 1];
            if (last && last[1] === slot * SLOT) last[1] += SLOT;
            else spans.push([slot * SLOT, slot * SLOT + SLOT]);
          });
          return spans;
        }
        grid.addEventListener("pointerdown", (event) => {
          const cell = cellAt(event);
          if (disabled || !cell) return;
          event.preventDefault();
          grid.setPointerCapture(event.pointerId);
          const before = cells.map((column) => column.map((c) => c.classList.contains("on")));
          painting = { from: position(cell), on: !cell.classList.contains("on"), before, days: new Set() };
          paint(position(cell));
        });
        grid.addEventListener("pointermove", (event) => {
          const cell = painting && cellAt(event);
          if (cell) paint(position(cell));
        });
        const finish = () => {
          if (!painting) return;
          for (const day of painting.days) days[day] = spansOf(day);
          painting = null;
          draw();
          describe();
        };
        grid.addEventListener("pointerup", finish);
        grid.addEventListener("pointercancel", finish);

        return {
          nodes: [text, grid],
          read: () => ({ days: days.map((spans) => spans.map((span) => [...span])) }),
          fill: (values) => {
            days = values.days.map((spans) => spans.map((span) => [...span]));
            draw();
            describe();
          },
          // Asked every second; only a change redraws, so a drag in progress is left alone.
          disable: (off) => {
            if (off === disabled) return;
            disabled = off;
            text.disabled = off;
            draw();
          },
          settle: async () => {
            if (typing) {
              clearTimeout(typing);
              await parseText();
            }
          },
          error: () => problem,
        };
      }

      const forms = {}; // per kind, built when first needed
      let editing = null; // { kind, item (as opened), isNew }

      function openEditor(kind, id) {
        const kindOf = KINDS[kind];
        const item = id ? kindOf.items().find((i) => i.id === id) : kindOf.create();
        if (!item) {
          location.hash = kindOf.path;
          return;
        }
        editing = { kind, item: structuredClone(item), isNew: !id };
        const form = (forms[kind] = forms[kind] || kindOf.form());
        $("form").replaceChildren(...form.nodes);
        form.fill(editing.item);
        $("editor-section").textContent = kindOf.title;
        $("editor-section").setAttribute("href", kindOf.path);
        $("editor-crumb").textContent = id ? item.name : kindOf.newLabel;
        $("editor-title").textContent = id ? `Edit ${kindOf.noun}` : kindOf.newLabel;
        $("editor-description").textContent = kindOf.editorDescription;
        $("cancel").setAttribute("href", kindOf.path);
        $("delete").hidden = !id;
        notify("editor-notices");
        $("editor-notices").dataset.lock = "";
        renderEditorLock();
        if (!id) setTimeout(() => form.name.focus(), 0);
      }

      // What runs keeps what it started with, so what it uses is read-only until it ends.
      function renderEditorLock() {
        if ($("view-editor").hidden || !editing) return;
        const held = !editing.isNew && KINDS[editing.kind].held(editing.item);
        forms[editing.kind].disable(!!held);
        $("save").disabled = !!held;
        $("delete").disabled = !!held;
        const box = $("editor-notices");
        const shown = box.dataset.lock === "1";
        if (held && !shown) {
          notify("editor-notices", "info", "Locked while running", held, { closable: false });
          box.dataset.lock = "1";
        } else if (!held && shown) {
          notify("editor-notices");
          box.dataset.lock = "";
        }
      }

      $("save").addEventListener("click", async () => {
        const { kind } = editing;
        const form = forms[kind];
        // What is still being typed counts, and what cannot be read is said here.
        await form.settle();
        const problem = form.error();
        if (problem) {
          notify("editor-notices", "error", `Could not save the ${KINDS[kind].noun}`, problem);
          $("editor-notices").dataset.lock = "";
          return;
        }
        $("save").disabled = true;
        try {
          await KINDS[kind].save(form.read(editing.item));
          location.hash = KINDS[kind].path;
        } catch (e) {
          notify("editor-notices", "error", `Could not save the ${KINDS[kind].noun}`, String(e));
          $("editor-notices").dataset.lock = "";
        }
        $("save").disabled = false;
        await refresh();
      });
      $("delete").addEventListener("click", () => editing && confirmDelete(editing.kind, editing.item.id));

      // ---- Settings: the unlock password.

      async function unlock() {
        const password = $("password").value;
        if (!password) return;
        $("unlock").disabled = true;
        try {
          // The app exits on success, so only a wrong password (or a failure) comes back here.
          await invoke("force_exit", { password });
        } catch (e) {
          notify("settings-notices", "error", "Not unlocked", String(e));
        }
        $("password").value = "";
        $("password").focus();
      }
      $("unlock").addEventListener("click", unlock);
      $("password").addEventListener("input", () => {
        $("unlock").disabled = !$("password").value;
        notify("settings-notices");
      });
      $("password").addEventListener("keydown", (event) => { if (event.key === "Enter") unlock(); });

      // ---- Pages, by the address after #: #/ (blocks), #/new, #/edit/<id>, the same under
      // #/lists and #/schedules, and #/settings.

      function route() {
        const hash = location.hash || "#/";
        let view = "list";
        let kind = "blocks";
        let edit = null;
        const match = hash.match(/^#\/(?:(lists|schedules)(?:\/|$))?(new|edit\/(.+))?$/);
        if (hash === "#/settings") view = "settings";
        else if (match) {
          kind = match[1] || "blocks";
          if (match[2]) {
            view = "editor";
            edit = match[3] ? decodeURIComponent(match[3]) : "";
          }
        }
        page = kind;
        for (const name of ["list", "editor", "settings"]) $(`view-${name}`).hidden = name !== view;
        // The editor belongs to its kind's page.
        const current = view === "settings" ? "settings" : kind;
        for (const action of document.querySelectorAll("cds-header-global-action")) action.active = action.dataset.page === current;
        if (view === "list") {
          const kindOf = KINDS[kind];
          $("list-title").textContent = kindOf.title;
          $("list-description").textContent = kindOf.description;
          $("new-item").replaceChildren(kindOf.newLabel, carbonIcon("add", "icon"));
          $("empty-title").textContent = kindOf.empty[0];
          $("empty-text").textContent = kindOf.empty[1];
          notify("list-notices");
          $("tiles").replaceChildren();
          tiles.clear();
          renderTiles(kind);
        }
        if (view === "editor") openEditor(kind, edit || null);
        else editing = null;
        if (view === "settings") {
          $("password").value = "";
          $("unlock").disabled = true;
          notify("settings-notices");
        }
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", route);
      $("new-item").addEventListener("click", () => (location.hash = KINDS[page].newPath));
      const PAGES = { blocks: "#/", lists: "#/lists", schedules: "#/schedules", settings: "#/settings" };
      for (const action of document.querySelectorAll("cds-header-global-action")) {
        action.append(carbonIcon(action.dataset.icon, "icon"));
        action.addEventListener("click", () => (location.hash = PAGES[action.dataset.page]));
      }
      $("delete").append(carbonIcon("trash-can", "icon"));

      // The window is made when it is asked for and shown once this page has drawn (`ui::window_ready`);
      // its X only hides it. While it is hidden nothing is looked at, so nothing is asked of the service.
      let visible = true;
      window.__TAURI__.event.listen("visibility", (event) => {
        visible = event.payload;
        if (visible) refresh();
      });
      setInterval(() => { if (visible && !document.hidden) refresh(); }, 1000);
      refresh()
        .then(route)
        .finally(() => {
          document.body.classList.add("ready");
          invoke("window_ready");
        });
    </script>
  </body>
</html>
