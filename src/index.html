<!doctype html>
<!-- spellcheck off for the whole page: names, domains and exe names are not words, and red underlines are noise. It is inherited by every field, also inside the web components. -->
<html lang="en" class="cds--g10" spellcheck="false">
  <head>
    <meta charset="utf-8" />
    <!-- No zooming: on a phone the page is an app (the sync server's page, `web.js`), and a field that
         gets focus does not zoom in either. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Bullseye</title>
    <!-- Added to a phone's home screen, the sync server's page opens as an app of its own: no browser
         bars, the app's icon on its dark ring's colour (`scripts/web-icons.py`; change the `?v=` after a new one, as iOS keeps an icon it has), and the status bar the
         colour of the heading under it (Carbon's layer-01 in g10 and g100). -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=20261031a" />
    <link rel="apple-touch-icon" href="icons/icon-180.png?v=20261031a" />
    <link rel="manifest" href="manifest.webmanifest?v=20261031a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bullseye" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Every text the window shows (src/strings.js): edit the copy there. -->
    <script src="strings.js"></script>
    <!-- The Carbon design system, vendored (`npm run vendor`, from scripts/carbon/entry.js): IBM Plex, the themes and
         tokens, and the cds-* web components. Nothing is loaded from the network. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <link rel="stylesheet" href="vendor/carbon.css" />
    <script>
      // Carbon's g10 theme, or g100 when Windows is set to dark; follows a change while open.
      (() => {
        const dark = matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          document.documentElement.classList.toggle("cds--g100", dark.matches);
          document.documentElement.classList.toggle("cds--g10", !dark.matches);
        };
        apply();
        dark.addEventListener("change", apply);
      })();
    </script>
    <script src="vendor/carbon.js"></script>
    <!-- In a browser (the sync server's page), a stand-in for Tauri; in the app it does nothing. -->
    <script src="js/web.js"></script>
    <!-- The page's own layout, in Carbon's tokens only. -->
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Texts: data-t is an element's text, data-t-<attribute> an attribute's (`applyStrings`). -->
    <!-- The fixed section, always in sight: the page's heading (its breadcrumb, title and description,
         one per view: `showView`) and the pages as contained tabs with an
         icon before the label (`markPage`, `PAGES`; an editor belongs to its kind's tab). What
         scrolls is the content below them, in #scroller. -->
    <div class="pinned">
      <div class="lane"><div class="cds--css-grid">
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <!-- Filled by `openEditor`: the page, then a session being made, then what is made for it. Other
               pages have just themselves in it (`showView`). -->
          <cds-breadcrumb class="trail" id="trail" no-trailing-slash></cds-breadcrumb>
          <div id="head-list" class="heading" hidden>
            <div class="page-header">
              <h1 class="cds--type-productive-heading-05" id="list-title"></h1>
              <cds-button id="new-item" kind="primary" size="md"></cds-button>
            </div>
            <p class="cds--type-body-01 tagline" id="list-description"></p>
          </div>
          <div id="head-editor" class="heading" hidden>
            <div class="page-header">
              <h1 class="cds--type-productive-heading-05" id="editor-title"></h1>
            </div>
            <p class="cds--type-body-01 tagline" id="editor-description"></p>
          </div>
          <div id="head-settings" class="heading" hidden>
            <div class="page-header">
              <h1 class="cds--type-productive-heading-05" data-t="settings.title"></h1>
            </div>
            <p class="cds--type-body-01 tagline" data-t="settings.description"></p>
          </div>
        </div>
      </div></div>
      <!-- Full width, with a subtle line above and below (`.tabbar`). -->
      <div class="tabbar">
        <div class="lane"><div class="cds--css-grid">
          <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
              <cds-tabs id="pages" data-t-aria-label="nav.label">
                <cds-tab value="sessions" data-icon="locked"><span class="label" data-t="sessions.title"></span></cds-tab>
                <cds-tab value="targets" data-icon="target-16"><span class="label" data-t="targets.title"></span></cds-tab>
                <cds-tab value="conditions" data-icon="rule-16"><span class="label" data-t="conditions.title"></span></cds-tab>
                <cds-tab value="settings" data-icon="settings"><span class="label" data-t="settings.title"></span></cds-tab>
              </cds-tabs>
          </div>
        </div></div>
      </div>
    </div>

    <div id="scroller">
    <main>
      <!-- One page per kind (sessions, targets, conditions): a tile each. Built from KINDS. -->
      <div id="view-list" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <div class="notices" id="list-notices"></div>
        </div>
        <div id="tiles"></div>
        <!-- Under one session shown on its own: back to all of them. -->
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16 show-all" id="show-all" hidden>
          <cds-button kind="tertiary" size="md" href="#/" id="show-all-button"></cds-button>
        </div>
        <cds-tile class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16 empty" id="empty" hidden>
          <h2 class="cds--type-productive-heading-03" id="empty-title"></h2>
          <p class="cds--type-body-01" id="empty-text"></p>
        </cds-tile>
      </div>

      <!-- Making or changing a target or a condition: the kind's form goes in #form. -->
      <div id="view-editor" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <div class="notices" id="editor-notices"></div>
          <div class="form">
            <div id="form" class="form"></div>
            <div class="form-actions">
              <cds-button id="delete" kind="danger-tertiary" size="md" hidden data-t="common.delete"></cds-button>
              <div class="end">
                <cds-button id="cancel" kind="secondary" size="md" href="#/" data-t="common.cancel"></cds-button>
                <cds-button id="save" kind="primary" size="md" data-t="common.save"></cds-button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings: unlocking, kept apart from the sessions. -->
      <div id="view-settings" class="cds--css-grid" hidden>
        <div class="cds--css-grid-column cds--sm:col-span-4 cds--md:col-span-8 cds--lg:col-span-16">
          <div class="setting">
            <h2 class="cds--type-productive-heading-03" data-t="settings.unlock"></h2>
            <p class="cds--type-body-01" id="unlock-text"></p>
            <div class="notices" id="settings-notices"></div>
            <cds-inline-notification id="unlock-state" class="form-note" kind="info" low-contrast hide-close-button></cds-inline-notification>
            <div class="row">
              <cds-button id="unlock" kind="danger" size="md"></cds-button>
              <cds-button id="unlock-answer" kind="tertiary" size="md" hidden></cds-button>
              <cds-button id="abort-unlock" kind="tertiary" size="md" data-t="common.keepLocked"></cds-button>
            </div>
          </div>
          <!-- How long unlocking takes: none to begin with, so unlock is free until a delay is set. -->
          <div class="setting">
            <h2 class="cds--type-productive-heading-03" data-t="settings.delayTitle"></h2>
            <p class="cds--type-body-01" data-t="settings.delayText"></p>
            <div class="notices" id="delay-notices"></div>
            <div class="row">
              <div id="delay-field"></div>
              <cds-button id="set-delay" kind="tertiary" size="md" data-t="settings.setDelay"></cds-button>
            </div>
          </div>
          <!-- One other way to unlock besides the delay (which is always there): either is enough. -->
          <div class="setting">
            <h2 class="cds--type-productive-heading-03" data-t="settings.way.title"></h2>
            <p class="cds--type-body-01" data-t="settings.way.text"></p>
            <div class="notices" id="way-notices"></div>
            <div class="row" id="way-controls"></div>
          </div>
          <!-- Everything defined, to a file and back: to move to another computer. -->
          <div class="setting" id="transfer-setting">
            <h2 class="cds--type-productive-heading-03" data-t="settings.transferTitle"></h2>
            <p class="cds--type-body-01" data-t="settings.transferText"></p>
            <div class="notices" id="transfer-notices"></div>
            <div class="row">
              <cds-button id="import" kind="tertiary" size="md"></cds-button>
              <cds-button id="export" kind="tertiary" size="md"></cds-button>
            </div>
          </div>
          <!-- Syncing with the other computers through a sync server (`syncing.rs`). -->
          <div class="setting" id="sync-setting">
            <h2 class="cds--type-productive-heading-03" data-t="sync.title"></h2>
            <p class="cds--type-body-01" data-t="sync.text"></p>
            <div class="notices" id="sync-notices"></div>
            <cds-inline-notification id="sync-state" class="form-note" kind="info" low-contrast hide-close-button></cds-inline-notification>
            <div class="row">
              <cds-button id="sync-connect" kind="tertiary" size="md"></cds-button>
              <cds-button id="sync-now" kind="tertiary" size="md" hidden></cds-button>
              <cds-button id="sync-disconnect" kind="danger-tertiary" size="md" hidden></cds-button>
            </div>
            <div id="sync-devices"></div>
            <div id="sync-held"></div>
          </div>
          <!-- On the sync server's page only (`web.js`): the token this browser keeps, forgotten. -->
          <div class="setting" id="sign-out-setting" hidden>
            <h2 class="cds--type-productive-heading-03" data-t="web.signOut"></h2>
            <p class="cds--type-body-01" data-t="web.signOutText"></p>
            <div class="row">
              <cds-button id="sign-out" kind="tertiary" size="md"></cds-button>
            </div>
          </div>
        </div>
      </div>
    </main>
    </div>

    <!-- Asks before anything that cannot be taken back (`ask` in the script). -->
    <cds-modal id="confirm" size="xs" prevent-close-on-click-outside>
      <cds-modal-header>
        <cds-modal-close-button></cds-modal-close-button>
        <cds-modal-heading id="confirm-heading"></cds-modal-heading>
      </cds-modal-header>
      <cds-modal-body>
        <cds-modal-body-content id="confirm-body"></cds-modal-body-content>
        <!-- Why a form was not accepted (a refusal of the service), in the dialog it was asked in. -->
        <cds-inline-notification id="confirm-error" kind="error" low-contrast hide-close-button hidden></cds-inline-notification>
        <!-- A form's fields: a lock's or allowance's settings, a list to choose from, or a text or password to stop with. -->
        <div id="confirm-fields" class="modal-fields" hidden></div>
      </cds-modal-body>
      <cds-modal-footer>
        <!-- Focus starts on Cancel, so a stray Enter or Space never confirms. -->
        <cds-modal-footer-button kind="secondary" data-modal-close data-modal-primary-focus data-t="common.cancel"></cds-modal-footer-button>
        <cds-modal-footer-button id="confirm-action"></cds-modal-footer-button>
      </cds-modal-footer>
    </cds-modal>

    <!-- The page's code, as modules (src/js): main.js starts it. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
