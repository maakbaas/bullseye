# The Bullseye sync server, from the image published with each release. Put the token in a `.env`
# file next to this one (BULLSEYE_TOKEN=...: at least 16 characters, e.g. from `openssl rand -hex 32`),
# and your reverse proxy in front of port 8080 for HTTPS.
services:
  bullseye-sync:
    image: ghcr.io/maakbaas/bullseye-sync:latest
    restart: unless-stopped
    environment:
      BULLSEYE_TOKEN: ${BULLSEYE_TOKEN:?set BULLSEYE_TOKEN in .env}
    volumes:
      - bullseye-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  bullseye-data:
